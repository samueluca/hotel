
<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Primavera - Login</title>

    <link rel="stylesheet" href="css/style2.css">

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #780101;
        }

        .titulo {
            color: rgb(198, 0, 0);
            background-color: white;
            border: 3px solid rgb(6, 6, 174);
            margin: 30px auto;
            border-radius: 30px;
            width: 300px;
            padding: 10px;
        }

        .meio {
            width: 500px;
            margin: 50px auto;
            text-align: center;
        }

        .form {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgb(139, 0, 0);
            text-align: center;
        }

        .input {
            border: 1px solid darkblue;
            border-radius: 8px;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            width: 330px;
        }

        .input:focus {
            outline: 3px solid blue;
        }

        .btn-enviar {
            width: 350px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            padding: 12px;
            background-color: darkblue;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-enviar:hover {
            background-color: #2563EB;
        }

        .cadastro {
            position: absolute;
            left: 10px;
            bottom: 25px;
        }

        .btn-cadastro {
            padding: 10px 20px;
            border: 2px solid darkblue;
            border-radius: 8px;
            background-color: white;
            font-weight: bold;
        }

        .btn-cadastro:hover {
            background-color: #2563EB;
        }

        .btn-cadastro a {
            color: darkblue;
            text-decoration: none;
        }

        .btn-cadastro a:hover {
            color: white;
        }

        h2 {
            color: #99ff00;
        }

    </style>

</head>

<body>

    <h1 class="titulo">
        🏨 Hotel Primavera
    </h1>

    <div class="meio">

        <h2>
            Acesso do Cliente
        </h2>

        <form class="form" action="autenticar.php" method="post">
            <label for="email">Email</label>
            <br>

            <input class="input" type="email" name="email" id="email" placeholder="seugmail@email.com.br"required><br>
            <label for="senha">Senha
            </label>

            <br>

            <input class="input"type="password" id="senha" name="senha" placeholder="Sua senha" required> <br><button class="btn-enviar" type="submit">
                ENTRAR
            </button>

        </form>

    </div>

    <div class="cadastro">

        <button class="btn-cadastro">

            <a href="cadastro_cliente.html">
                Não é cadastrado?
                <br>
                Aperte aqui
            </a>

        </button>

    </div>

</body>

</html>
